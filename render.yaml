# Render Blueprint: free Laravel API for the public demo.
services:
  - type: web
    name: smart-dispatch-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_URL
        value: https://smart-dispatch-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-dispatch-demo.vercel.app
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "true"
